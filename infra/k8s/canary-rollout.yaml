apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: nexasphere-backend
spec:
  replicas: 5
  strategy:
    canary:
      # Use Istio VirtualService to split traffic
      trafficRouting:
        istio:
          virtualService:
            name: nexasphere-backend-vs
            routes:
            - primary
      steps:
      - setWeight: 5
      - pause: {duration: 10m} # Wait 10 minutes, evaluate metrics
      - setWeight: 20
      - pause: {duration: 5m}
      - setWeight: 50
      - pause: {duration: 5m}
      - setWeight: 100
