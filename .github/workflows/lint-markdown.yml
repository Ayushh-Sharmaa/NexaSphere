# Markdown Linting Workflow (Issue #832 — Option 1)
# Automatically checks all .md files for formatting consistency on every PR.
name: Lint Markdown

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - '**.md'
      - '.markdownlint.json'
      - '.github/workflows/lint-markdown.yml'
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.markdownlint.json'

jobs:
  markdownlint:
    name: Markdown — Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules" "#**/node_modules" "#**/dist" "#.gemini" "#.agents"

