# Markdown Linting Workflow (Issue #832 — Option 1)
# Automatically checks all .md files for formatting consistency on every PR.
name: Lint Markdown

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - '**.md'
      - '.markdownlint.json'
      - '.github/workflows/lint-markdown.yml'
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.markdownlint.json'

jobs:
  markdownlint:
    name: Markdown — Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        uses: actions/checkout@v6

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          # Lint all markdown files in the repo, excluding generated/vendor dirs
          globs: |
            **/*.md
            !node_modules/**
            !**/node_modules/**
            !website/dist/**
            !admin-dashboard/dist/**
            !.github/**
            !test-results/**
            !**/test-results/**
          config: '.markdownlint.json'
name: Markdown Linter

# 1. WHEN to run: Whenever someone opens a Pull Request to the main branch
on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.md' # Only run if a Markdown (.md) file was changed

# 2. WHAT to do:
jobs:
  lint:
    runs-on: ubuntu-latest # Run this on a clean, cloud-based computer

    steps:
      - name: Copy project files
        uses: actions/checkout@v4 # This grabs your code so the tool can look at it

      - name: Check markdown formatting
        uses: davidanson/markdownlint-cli2-action@v24 # This is the official community tool
        with:
          globs: '**/*.md' # Tell it to scan every single .md file
          config: '.markdownlint.json'
