name: Kubernetes Manifest Validation

on:
  push:
    branches:
      - main
    paths:
      - 'infra/k8s/**'
      - '.github/workflows/kubeconform.yml'
  pull_request:
    paths:
      - 'infra/k8s/**'
      - '.github/workflows/kubeconform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kubeconform:
    name: Validate Manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kubeconform
        run: |
          KUBECONFORM_VERSION="0.6.7"
          curl -sL https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz | tar -xz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: Run Kubeconform Validation
        id: validate
        run: |
          set -o pipefail
          if [ -d infra/k8s ]; then
            kubeconform -summary -ignore-missing-schemas -output tap infra/k8s/ | tee kubeconform-output.log
          else
            echo "1..1" > kubeconform-output.log
            echo "ok 1 - No k8s manifests found" >> kubeconform-output.log
          fi
        continue-on-error: true

      - name: Generate Job Summary
        run: |
          echo "## Kubeconform Validation Results" >> $GITHUB_STEP_SUMMARY
          echo '```tap' >> $GITHUB_STEP_SUMMARY
          cat kubeconform-output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload validation logs on failure
        if: steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: kubeconform-logs
          path: kubeconform-output.log
          retention-days: 7

      - name: Fail workflow on validation error
        if: steps.validate.outcome == 'failure'
        run: |
          echo "Kubernetes manifest validation failed! Please check the logs and job summary."
          exit 1
