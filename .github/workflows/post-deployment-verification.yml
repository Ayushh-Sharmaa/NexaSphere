name: Post-Deployment Verification

on:
  workflow_run:
    workflows: ["Production Deployment"]
    types:
      - completed

jobs:
  verify:
    name: Verify Application Health
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Wait for stabilization
        run: sleep 30

      - name: Check Backend Health Endpoint
        run: |
          echo "Starting health check verification..."
          for i in {1..5}; do
            HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" https://nexasphere-api.onrender.com/health || echo "Failed to connect")
            if [ "$HTTP_STATUS" == "200" ]; then
              echo "Backend is healthy (HTTP 200)."
              exit 0
            fi
            echo "Attempt $i: Backend not ready (Status: $HTTP_STATUS). Retrying in 15 seconds..."
            sleep 15
          done
          echo "Backend failed to become healthy within the timeout period."
          exit 1
