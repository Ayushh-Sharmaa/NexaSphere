name: Auto-Label Issues & PRs

# ─────────────────────────────────────────────────────────────────────────────
# Automatically applies labels to issues and PRs based on:
#   - Issue: keywords in title/body → area, type, and priority labels
#   - PR: changed file paths → area labels, diff size → size labels
#
# This is the "fallback" labeler — runs on every issue/PR event to ensure
# nothing goes unlabeled.
# ─────────────────────────────────────────────────────────────────────────────

on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1: Label Issues by content/keywords
  # ─────────────────────────────────────────────────────────────────────────
  label-issue:
    name: Auto-Label Issue
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest

    steps:
      - name: Apply labels based on issue content
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const issueNum = issue.number;
            const title = (issue.title || '').toLowerCase();
            const body  = (issue.body || '').toLowerCase();
            const text  = `${title} ${body}`;
            const existingLabels = (issue.labels || []).map(l => l.name);

            // ── Helper: ensure label exists then add it ───────────────────────
            async function ensureAndAdd(name, color, description) {
              if (existingLabels.includes(name)) return;
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, name, color, description });
                }
              }
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issueNum, labels: [name],
              });
              console.log(`🏷️  Added label: ${name}`);
            }

            // ── Type labels ──────────────────────────────────────────────────
            const TYPE_RULES = [
              { keywords: ['bug', 'error', 'crash', 'broken', 'fix', 'issue', 'not working', 'fails', 'failure'], label: 'bug', color: 'd73a4a', desc: 'Something isn\'t working' },
              { keywords: ['feature', 'enhancement', 'add support', 'new feature', 'implement', 'request'], label: 'enhancement', color: 'a2eeef', desc: 'New feature or request' },
              { keywords: ['docs', 'documentation', 'readme', 'typo', 'spelling'], label: 'documentation', color: '0075ca', desc: 'Improvements or additions to documentation' },
              { keywords: ['performance', 'slow', 'optimize', 'speed', 'latency', 'memory leak'], label: 'performance', color: 'f9d0c4', desc: 'Performance improvement' },
              { keywords: ['security', 'vulnerability', 'xss', 'sql injection', 'csrf', 'auth'], label: 'security', color: 'e11d48', desc: 'Security related issue' },
              { keywords: ['ui', 'ux', 'design', 'layout', 'style', 'css', 'responsive', 'mobile'], label: 'UI/UX', color: '7057ff', desc: 'User interface / experience' },
              { keywords: ['test', 'testing', 'unit test', 'e2e', 'coverage'], label: 'testing', color: 'bfd4f2', desc: 'Testing related' },
              { keywords: ['accessibility', 'a11y', 'screen reader', 'aria'], label: 'accessibility', color: '0e8a16', desc: 'Accessibility improvement' },
            ];

            for (const rule of TYPE_RULES) {
              if (rule.keywords.some(kw => text.includes(kw))) {
                await ensureAndAdd(rule.label, rule.color, rule.desc);
              }
            }

            // ── Area labels ──────────────────────────────────────────────────
            const AREA_RULES = [
              { keywords: ['frontend', 'website', 'react', 'vite', 'component', 'page', 'navbar', 'footer', 'landing'], label: 'frontend', color: '61dafb', desc: 'Frontend / website related' },
              { keywords: ['backend', 'server', 'api', 'express', 'endpoint', 'route', 'middleware'], label: 'backend', color: '68a063', desc: 'Backend / server related' },
              { keywords: ['admin', 'dashboard', 'admin-dashboard', 'admin panel'], label: 'admin-dashboard', color: '0052cc', desc: 'Admin dashboard related' },
              { keywords: ['database', 'migration', 'sql', 'postgres', 'prisma', 'schema', 'supabase'], label: 'database', color: '336791', desc: 'Database related' },
              { keywords: ['android', 'mobile', 'kotlin', 'gradle', 'apk'], label: 'android', color: '3ddc84', desc: 'Android app related' },
              { keywords: ['python', 'fastapi', 'alembic', 'celery', 'flask'], label: 'python', color: '3776ab', desc: 'Python backend related' },
              { keywords: ['java', 'spring', 'maven', 'flyway'], label: 'java', color: 'b07219', desc: 'Java backend related' },
              { keywords: ['ci', 'cd', 'github actions', 'workflow', 'pipeline', 'deploy', 'vercel'], label: 'CI/CD', color: '000000', desc: 'CI/CD pipeline related' },
              { keywords: ['docker', 'container', 'kubernetes', 'terraform', 'infra', 'infrastructure', 'aws'], label: 'infrastructure', color: '2496ed', desc: 'Infrastructure / DevOps related' },
            ];

            for (const rule of AREA_RULES) {
              if (rule.keywords.some(kw => text.includes(kw))) {
                await ensureAndAdd(rule.label, rule.color, rule.desc);
              }
            }

            // ── Priority labels ──────────────────────────────────────────────
            const PRIORITY_RULES = [
              { keywords: ['critical', 'urgent', 'asap', 'blocker', 'production down', 'p0'], label: 'priority: critical', color: 'b60205', desc: 'Must fix immediately' },
              { keywords: ['high priority', 'important', 'p1'], label: 'priority: high', color: 'd93f0b', desc: 'High priority issue' },
              { keywords: ['low priority', 'nice to have', 'p3', 'minor'], label: 'priority: low', color: 'c2e0c6', desc: 'Low priority issue' },
            ];

            for (const rule of PRIORITY_RULES) {
              if (rule.keywords.some(kw => text.includes(kw))) {
                await ensureAndAdd(rule.label, rule.color, rule.desc);
              }
            }

            // ── GSSoC / NSOC labels ──────────────────────────────────────────
            const PROGRAM_RULES = [
              { keywords: ['gssoc', "gssoc'26", 'gssoc 26'], label: "GSSoC'26", color: 'ff6f00', desc: 'GSSoC 2026 program' },
              { keywords: ['nsoc', "nsoc'26", 'nsoc 26'], label: "NSOC'26", color: '0E8A16', desc: 'NSOC 2026 program' },
            ];

            for (const rule of PROGRAM_RULES) {
              if (rule.keywords.some(kw => text.includes(kw))) {
                await ensureAndAdd(rule.label, rule.color, rule.desc);
              }
            }

            // ── Difficulty labels ────────────────────────────────────────────
            const DIFF_RULES = [
              { keywords: ['beginner', 'easy', 'good first issue', 'starter', 'simple'], label: 'good first issue', color: '7057ff', desc: 'Good for newcomers' },
              { keywords: ['intermediate', 'moderate', 'medium difficulty'], label: 'intermediate', color: 'fbca04', desc: 'Intermediate difficulty' },
              { keywords: ['advanced', 'complex', 'hard', 'difficult', 'expert'], label: 'advanced', color: 'b60205', desc: 'Advanced difficulty' },
            ];

            for (const rule of DIFF_RULES) {
              if (rule.keywords.some(kw => text.includes(kw))) {
                await ensureAndAdd(rule.label, rule.color, rule.desc);
              }
            }

            console.log(`✅ Issue #${issueNum} label scan complete`);

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: Label PRs by changed file paths + size
  # ─────────────────────────────────────────────────────────────────────────
  label-pr:
    name: Auto-Label PR
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest

    steps:
      - name: Apply labels based on changed files and PR size
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pr    = context.payload.pull_request;
            const prNum = pr.number;
            const existingLabels = (pr.labels || []).map(l => l.name);

            // ── Helper: ensure label exists then add it ───────────────────────
            const labelsToAdd = new Set();

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, name, color, description });
                }
              }
            }

            // ── Get changed files ─────────────────────────────────────────────
            const files = [];
            let page = 1;
            while (true) {
              const { data } = await github.rest.pulls.listFiles({
                owner, repo, pull_number: prNum, per_page: 100, page,
              });
              files.push(...data);
              if (data.length < 100) break;
              page++;
            }

            const filePaths = files.map(f => f.filename);
            const totalChanges = files.reduce((sum, f) => sum + f.additions + f.deletions, 0);

            // ── Path-based area labels ────────────────────────────────────────
            const PATH_RULES = [
              { pattern: /^website\//, label: 'frontend', color: '61dafb', desc: 'Frontend / website related' },
              { pattern: /^server\//, label: 'backend', color: '68a063', desc: 'Backend / server related' },
              { pattern: /^admin-dashboard\//, label: 'admin-dashboard', color: '0052cc', desc: 'Admin dashboard related' },
              { pattern: /^server-python\//, label: 'python', color: '3776ab', desc: 'Python backend related' },
              { pattern: /^server-java\//, label: 'java', color: 'b07219', desc: 'Java backend related' },
              { pattern: /^android\//, label: 'android', color: '3ddc84', desc: 'Android app related' },
              { pattern: /^\.github\//, label: 'CI/CD', color: '000000', desc: 'CI/CD pipeline related' },
              { pattern: /^(docs\/|.*\.md$)/, label: 'documentation', color: '0075ca', desc: 'Documentation changes' },
              { pattern: /^(prisma\/|.*migrations\/)/, label: 'database', color: '336791', desc: 'Database related' },
              { pattern: /^(infra\/|infrastructure\/|.*\.tf$)/, label: 'infrastructure', color: '2496ed', desc: 'Infrastructure / DevOps related' },
              { pattern: /^(e2e\/|.*\.test\.|.*\.spec\.|.*test-results\/)/, label: 'testing', color: 'bfd4f2', desc: 'Testing related' },
            ];

            for (const rule of PATH_RULES) {
              if (filePaths.some(fp => rule.pattern.test(fp))) {
                if (!existingLabels.includes(rule.label)) {
                  await ensureLabel(rule.label, rule.color, rule.desc);
                  labelsToAdd.add(rule.label);
                }
              }
            }

            // ── Size labels ──────────────────────────────────────────────────
            const SIZE_RULES = [
              { max: 10,   label: 'size/XS', color: 'c2e0c6', desc: 'Extra small PR (1-10 lines)' },
              { max: 50,   label: 'size/S',  color: '77dd77', desc: 'Small PR (11-50 lines)' },
              { max: 200,  label: 'size/M',  color: 'fbca04', desc: 'Medium PR (51-200 lines)' },
              { max: 500,  label: 'size/L',  color: 'f9a03f', desc: 'Large PR (201-500 lines)' },
              { max: Infinity, label: 'size/XL', color: 'e11d48', desc: 'Extra large PR (500+ lines)' },
            ];

            // Remove any existing size labels first
            const sizeLabels = SIZE_RULES.map(r => r.label);
            const existingSize = existingLabels.filter(l => sizeLabels.includes(l));

            const sizeRule = SIZE_RULES.find(r => totalChanges <= r.max);
            if (sizeRule && !existingLabels.includes(sizeRule.label)) {
              // Remove old size labels
              for (const old of existingSize) {
                try {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: prNum, name: old,
                  });
                } catch (_) {}
              }
              await ensureLabel(sizeRule.label, sizeRule.color, sizeRule.desc);
              labelsToAdd.add(sizeRule.label);
            }

            // ── Apply all collected labels at once ────────────────────────────
            if (labelsToAdd.size > 0) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: prNum,
                labels: [...labelsToAdd],
              });
              console.log(`🏷️  Applied labels to PR #${prNum}: ${[...labelsToAdd].join(', ')}`);
            } else {
              console.log(`ℹ️  PR #${prNum} — no new labels needed`);
            }
