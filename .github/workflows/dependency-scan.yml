name: Dependency Scanning & Vulnerability Fixes

on:
  schedule:
    - cron: '0 6 * * 1'   
  push:
    branches: [main]
    paths:
      - '**/package.json'
      - '**/package-lock.json'
  pull_request:
    branches: [main]
  workflow_dispatch:         # Manual trigger 

jobs:
  # ─────────────────────────────────────────
  # JOB 1: npm audit scan
  # ─────────────────────────────────────────
  audit-scan:
    name: npm Audit Scan
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        workspace: ['.', 'website', 'server', 'admin-dashboard']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js v20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (${{ matrix.workspace }})
        working-directory: ${{ matrix.workspace }}
        run: npm install --legacy-peer-deps

      - name: Run npm audit (${{ matrix.workspace }})
        working-directory: ${{ matrix.workspace }}
        run: |
          echo "### Audit Report: ${{ matrix.workspace }}" >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=moderate --json > audit-report.json || true
          npm audit --audit-level=moderate 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        with:
          name: audit-report-${{ matrix.workspace == '.' && 'root' || matrix.workspace }}
          path: ${{ matrix.workspace }}/audit-report.json
          retention-days: 30

      - name: Check for CRITICAL vulnerabilities
        working-directory: ${{ matrix.workspace }}
        continue-on-error: true
        run: |
          echo "### Critical Vulnerability Check: ${{ matrix.workspace }}" >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=critical 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "⚠️ Critical vulnerabilities found in ${{ matrix.workspace }} — review audit report" >> $GITHUB_STEP_SUMMARY
          fi
          exit $EXIT_CODE

  # ─────────────────────────────────────────
  # JOB 2: Auto-fix patch updates
  # ─────────────────────────────────────────
  auto-fix:
    name: Auto Fix Patch Updates
    runs-on: ubuntu-latest
    needs: audit-scan
    if: |
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js v20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Fix root vulnerabilities
        run: npm audit fix --omit=dev || true

      - name: Fix website vulnerabilities
        working-directory: website
        run: npm audit fix --omit=dev || true

      - name: Fix server vulnerabilities
        working-directory: server
        run: npm audit fix --omit=dev || true

      - name: Fix admin-dashboard vulnerabilities
        working-directory: admin-dashboard
        run: npm audit fix --omit=dev || true

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request with fixes
        if: steps.changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'fix(security): auto-fix npm audit vulnerabilities'
          branch: security/auto-fix-vulnerabilities
          title: '[Security] Auto-fix npm audit vulnerabilities'
          body: |
            ## Automated Security Fix

            This PR was automatically created by the Dependency Scanning workflow.

            ### What changed?
            - `npm audit fix` ran on root, website, server, and admin-dashboard workspaces
            - Only patch-level safe fixes applied (no breaking changes)

            ### Review checklist
            - [ ] Review changed `package-lock.json` files
            - [ ] Check that tests still pass
            - [ ] Verify no breaking changes

            Closes #1646
          labels: security, automated, dependencies

  # ─────────────────────────────────────────
  # JOB 3: Test after update
  # ─────────────────────────────────────────
  test-after-update:
    name: Test Suite After Updates
    runs-on: ubuntu-latest
    needs: audit-scan
    if: |
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js v20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install all dependencies
        run: npm install --legacy-peer-deps

      - name: Run website unit tests
        run: npm test --workspace=website || true

      - name: Run server tests
        run: npm run test:server || true