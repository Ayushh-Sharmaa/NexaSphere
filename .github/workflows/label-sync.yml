name: Retroactive Automation — Backfill Last 72 Hours

# ─────────────────────────────────────────────────────────────────────────────
# Manual workflow to retroactively run ALL automation across issues and PRs
# created within the last 72 hours. This covers:
#
#   ✅ Auto-labeling (type, area, priority, difficulty, program)
#   ✅ PR path-based labels (frontend, backend, etc.)
#   ✅ PR size labels (XS / S / M / L / XL)
#   ✅ NSOC'26 label on all issues
#   ✅ Issue validation (bug reports: description, steps, expected behavior)
#   ✅ PR author auto-assignment
#   ✅ Admin dashboard credentials comment on relevant PRs
#
# Usage:  Actions → Retroactive Automation → Run workflow
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      hours_back:
        description: 'How many hours back to scan (default: 72)'
        required: false
        default: '72'
      dry_run:
        description: 'Dry run — log actions without applying them'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Process all recent ISSUES
  # ═══════════════════════════════════════════════════════════════════════════
  backfill-issues:
    name: "Backfill Issues (last ${{ inputs.hours_back || '72' }}h)"
    runs-on: ubuntu-latest

    steps:
      - name: Process all recent issues
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const hoursBack = parseInt('${{ inputs.hours_back }}' || '72', 10);
            const dryRun = '${{ inputs.dry_run }}' === 'true';
            const cutoff = new Date(Date.now() - hoursBack * 60 * 60 * 1000);

            if (dryRun) console.log('🔍 DRY RUN MODE — no changes will be made\n');
            console.log(`📅 Scanning issues created after: ${cutoff.toISOString()}\n`);

            // ── Helper: ensure label exists ─────────────────────────────────
            const labelCache = new Set();
            async function ensureLabel(name, color, description) {
              if (labelCache.has(name)) return;
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status === 404 && !dryRun) {
                  await github.rest.issues.createLabel({ owner, repo, name, color, description });
                  console.log(`  🆕 Created label: ${name}`);
                }
              }
              labelCache.add(name);
            }

            async function addLabels(issueNum, labels) {
              if (!dryRun) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issueNum, labels });
              }
            }

            // ── Label rules ─────────────────────────────────────────────────
            const TYPE_RULES = [
              { keywords: ['bug', 'error', 'crash', 'broken', 'fix', 'not working', 'fails', 'failure'], label: 'bug', color: 'd73a4a', desc: "Something isn't working" },
              { keywords: ['feature', 'enhancement', 'add support', 'new feature', 'implement', 'request'], label: 'enhancement', color: 'a2eeef', desc: 'New feature or request' },
              { keywords: ['docs', 'documentation', 'readme', 'typo', 'spelling'], label: 'documentation', color: '0075ca', desc: 'Documentation' },
              { keywords: ['performance', 'slow', 'optimize', 'speed', 'latency', 'memory leak'], label: 'performance', color: 'f9d0c4', desc: 'Performance improvement' },
              { keywords: ['security', 'vulnerability', 'xss', 'sql injection', 'csrf', 'auth'], label: 'security', color: 'e11d48', desc: 'Security related' },
              { keywords: ['ui', 'ux', 'design', 'layout', 'style', 'css', 'responsive', 'mobile'], label: 'UI/UX', color: '7057ff', desc: 'User interface / experience' },
              { keywords: ['test', 'testing', 'unit test', 'e2e', 'coverage'], label: 'testing', color: 'bfd4f2', desc: 'Testing related' },
              { keywords: ['accessibility', 'a11y', 'screen reader', 'aria'], label: 'accessibility', color: '0e8a16', desc: 'Accessibility improvement' },
            ];

            const AREA_RULES = [
              { keywords: ['frontend', 'website', 'react', 'vite', 'component', 'page', 'navbar', 'footer', 'landing'], label: 'frontend', color: '61dafb', desc: 'Frontend / website' },
              { keywords: ['backend', 'server', 'api', 'express', 'endpoint', 'route', 'middleware'], label: 'backend', color: '68a063', desc: 'Backend / server' },
              { keywords: ['admin', 'dashboard', 'admin-dashboard', 'admin panel'], label: 'admin-dashboard', color: '0052cc', desc: 'Admin dashboard' },
              { keywords: ['database', 'migration', 'sql', 'postgres', 'prisma', 'schema', 'supabase'], label: 'database', color: '336791', desc: 'Database related' },
              { keywords: ['android', 'mobile', 'kotlin', 'gradle', 'apk'], label: 'android', color: '3ddc84', desc: 'Android app' },
              { keywords: ['python', 'fastapi', 'alembic', 'celery', 'flask'], label: 'python', color: '3776ab', desc: 'Python backend' },
              { keywords: ['java', 'spring', 'maven', 'flyway'], label: 'java', color: 'b07219', desc: 'Java backend' },
              { keywords: ['ci', 'cd', 'github actions', 'workflow', 'pipeline', 'deploy', 'vercel'], label: 'CI/CD', color: '000000', desc: 'CI/CD pipeline' },
              { keywords: ['docker', 'container', 'kubernetes', 'terraform', 'infra', 'infrastructure', 'aws'], label: 'infrastructure', color: '2496ed', desc: 'Infrastructure / DevOps' },
            ];

            const PRIORITY_RULES = [
              { keywords: ['critical', 'urgent', 'asap', 'blocker', 'production down', 'p0'], label: 'priority: critical', color: 'b60205', desc: 'Must fix immediately' },
              { keywords: ['high priority', 'important', 'p1'], label: 'priority: high', color: 'd93f0b', desc: 'High priority' },
              { keywords: ['low priority', 'nice to have', 'p3', 'minor'], label: 'priority: low', color: 'c2e0c6', desc: 'Low priority' },
            ];

            const DIFF_RULES = [
              { keywords: ['beginner', 'easy', 'good first issue', 'starter', 'simple'], label: 'good first issue', color: '7057ff', desc: 'Good for newcomers' },
              { keywords: ['intermediate', 'moderate', 'medium difficulty'], label: 'intermediate', color: 'fbca04', desc: 'Intermediate difficulty' },
              { keywords: ['advanced', 'complex', 'hard', 'difficult', 'expert'], label: 'advanced', color: 'b60205', desc: 'Advanced difficulty' },
            ];

            const PROGRAM_RULES = [
              { keywords: ['gssoc', "gssoc'26", 'gssoc 26'], label: "GSSoC'26", color: 'ff6f00', desc: 'GSSoC 2026' },
            ];

            const ALL_RULES = [...TYPE_RULES, ...AREA_RULES, ...PRIORITY_RULES, ...DIFF_RULES, ...PROGRAM_RULES];

            // ── Bug validation patterns ──────────────────────────────────────
            const BUG_SECTIONS = [
              { pattern: /^#{1,6}\s*(?:bug\s+)?description\b/im, label: '**Description**' },
              { pattern: /^#{1,6}\s*steps\s+to\s+reproduce\b/im, label: '**Steps to Reproduce**' },
              { pattern: /^#{1,6}\s*expected\s+behav(?:ior|iour)\b/im, label: '**Expected Behavior**' },
            ];

            // ── Ensure NSOC'26 label exists ──────────────────────────────────
            await ensureLabel("NSOC'26", '0E8A16', "Automatically applied for NSOC'26");
            await ensureLabel('needs-more-info', 'e4e669', 'Issue needs more information');
            await ensureLabel('valid-issue', '0e8a16', 'Issue has all required information');

            // ── Iterate all recent issues ────────────────────────────────────
            let page = 1;
            let stats = { total: 0, labeled: 0, nsoc: 0, validated: 0 };

            while (true) {
              const { data: issues } = await github.rest.issues.listForRepo({
                owner, repo, state: 'all', sort: 'created', direction: 'desc',
                per_page: 100, page, since: cutoff.toISOString(),
              });

              if (issues.length === 0) break;

              for (const issue of issues) {
                // Skip PRs (GitHub API includes them in issues list)
                if (issue.pull_request) continue;

                const created = new Date(issue.created_at);
                if (created < cutoff) continue;

                stats.total++;
                const title = (issue.title || '').toLowerCase();
                const body  = (issue.body || '').toLowerCase();
                const text  = `${title} ${body}`;
                const existing = issue.labels.map(l => l.name);
                const newLabels = [];

                // ── 1. Content-based labels ─────────────────────────────────
                for (const rule of ALL_RULES) {
                  if (!existing.includes(rule.label) && rule.keywords.some(kw => text.includes(kw))) {
                    await ensureLabel(rule.label, rule.color, rule.desc);
                    newLabels.push(rule.label);
                  }
                }

                // ── 2. NSOC'26 label ────────────────────────────────────────
                if (!existing.includes("NSOC'26")) {
                  newLabels.push("NSOC'26");
                  stats.nsoc++;
                }

                // ── 3. Apply collected labels ───────────────────────────────
                if (newLabels.length > 0) {
                  await addLabels(issue.number, newLabels);
                  console.log(`🏷️  Issue #${issue.number}: +${newLabels.join(', ')}`);
                  stats.labeled++;
                }

                // ── 4. Bug report validation ────────────────────────────────
                const isBug = [...existing, ...newLabels].includes('bug');
                if (isBug) {
                  const rawBody = issue.body || '';
                  const missing = BUG_SECTIONS.filter(s => !s.pattern.test(rawBody));

                  if (missing.length > 0 && !existing.includes('needs-more-info')) {
                    await ensureLabel('needs-more-info', 'e4e669', 'Issue needs more information');
                    await addLabels(issue.number, ['needs-more-info']);

                    if (!dryRun) {
                      // Check if we already posted a validation comment
                      const { data: comments } = await github.rest.issues.listComments({
                        owner, repo, issue_number: issue.number, per_page: 10,
                      });
                      const alreadyPosted = comments.some(
                        c => c.user.login === 'github-actions[bot]' && c.body.includes('Issue Needs More Information')
                      );

                      if (!alreadyPosted) {
                        const missingList = missing.map(s => `- ❌ Missing: ${s.label}`).join('\n');
                        await github.rest.issues.createComment({
                          owner, repo, issue_number: issue.number,
                          body: [
                            `## ⚠️ Issue Needs More Information`,
                            ``,
                            `Hey @${issue.user.login}! Your bug report is missing some required sections:`,
                            ``,
                            missingList,
                            ``,
                            `**Please edit your issue** to include these sections for faster triage.`,
                            ``,
                            `_Retroactive validation by NexaSphere automation_`,
                          ].join('\n'),
                        });
                      }
                    }
                    console.log(`  ⚠️  Issue #${issue.number}: bug report missing ${missing.length} section(s)`);
                    stats.validated++;
                  } else if (missing.length === 0 && !existing.includes('valid-issue')) {
                    await addLabels(issue.number, ['valid-issue']);
                    console.log(`  ✅ Issue #${issue.number}: bug report is complete`);
                    stats.validated++;
                  }
                }
              }

              // Stop if we've gone past the cutoff
              const oldest = new Date(issues[issues.length - 1].created_at);
              if (oldest < cutoff) break;
              page++;
            }

            console.log(`\n${'═'.repeat(50)}`);
            console.log(`📊 Issues Summary`);
            console.log(`   Total scanned: ${stats.total}`);
            console.log(`   Labeled:       ${stats.labeled}`);
            console.log(`   NSOC'26 added: ${stats.nsoc}`);
            console.log(`   Bugs validated: ${stats.validated}`);
            console.log(`${'═'.repeat(50)}`);

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: Process all recent PULL REQUESTS
  # ═══════════════════════════════════════════════════════════════════════════
  backfill-prs:
    name: "Backfill PRs (last ${{ inputs.hours_back || '72' }}h)"
    runs-on: ubuntu-latest

    steps:
      - name: Process all recent pull requests
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const hoursBack = parseInt('${{ inputs.hours_back }}' || '72', 10);
            const dryRun = '${{ inputs.dry_run }}' === 'true';
            const cutoff = new Date(Date.now() - hoursBack * 60 * 60 * 1000);

            if (dryRun) console.log('🔍 DRY RUN MODE — no changes will be made\n');
            console.log(`📅 Scanning PRs created after: ${cutoff.toISOString()}\n`);

            // ── Helper: ensure label exists ─────────────────────────────────
            const labelCache = new Set();
            async function ensureLabel(name, color, description) {
              if (labelCache.has(name)) return;
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status === 404 && !dryRun) {
                  await github.rest.issues.createLabel({ owner, repo, name, color, description });
                  console.log(`  🆕 Created label: ${name}`);
                }
              }
              labelCache.add(name);
            }

            async function addLabels(prNum, labels) {
              if (!dryRun) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: prNum, labels });
              }
            }

            async function removeLabel(prNum, name) {
              if (!dryRun) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: prNum, name });
                } catch (_) {}
              }
            }

            // ── Path-based label rules ──────────────────────────────────────
            const PATH_RULES = [
              { pattern: /^website\//, label: 'frontend', color: '61dafb', desc: 'Frontend / website' },
              { pattern: /^server\//, label: 'backend', color: '68a063', desc: 'Backend / server' },
              { pattern: /^admin-dashboard\//, label: 'admin-dashboard', color: '0052cc', desc: 'Admin dashboard' },
              { pattern: /^server-python\//, label: 'python', color: '3776ab', desc: 'Python backend' },
              { pattern: /^server-java\//, label: 'java', color: 'b07219', desc: 'Java backend' },
              { pattern: /^android\//, label: 'android', color: '3ddc84', desc: 'Android app' },
              { pattern: /^\.github\//, label: 'CI/CD', color: '000000', desc: 'CI/CD pipeline' },
              { pattern: /^(docs\/|.*\.md$)/, label: 'documentation', color: '0075ca', desc: 'Documentation' },
              { pattern: /^(prisma\/|.*migrations\/)/, label: 'database', color: '336791', desc: 'Database' },
              { pattern: /^(infra\/|infrastructure\/|.*\.tf$)/, label: 'infrastructure', color: '2496ed', desc: 'Infrastructure' },
              { pattern: /^(e2e\/|.*\.test\.|.*\.spec\.)/, label: 'testing', color: 'bfd4f2', desc: 'Testing' },
            ];

            const SIZE_RULES = [
              { max: 10,       label: 'size/XS', color: 'c2e0c6', desc: 'Extra small (1-10 lines)' },
              { max: 50,       label: 'size/S',  color: '77dd77', desc: 'Small (11-50 lines)' },
              { max: 200,      label: 'size/M',  color: 'fbca04', desc: 'Medium (51-200 lines)' },
              { max: 500,      label: 'size/L',  color: 'f9a03f', desc: 'Large (201-500 lines)' },
              { max: Infinity, label: 'size/XL', color: 'e11d48', desc: 'Extra large (500+ lines)' },
            ];

            const sizeLabels = SIZE_RULES.map(r => r.label);

            // ── Iterate all recent PRs ──────────────────────────────────────
            let page = 1;
            let stats = { total: 0, labeled: 0, assigned: 0, adminCommented: 0 };

            while (true) {
              const { data: prs } = await github.rest.pulls.list({
                owner, repo, state: 'all', sort: 'created', direction: 'desc',
                per_page: 100, page,
              });

              if (prs.length === 0) break;

              for (const pr of prs) {
                const created = new Date(pr.created_at);
                if (created < cutoff) continue;

                // Skip bots
                if (pr.user.login.includes('[bot]')) continue;

                stats.total++;
                const existing = pr.labels.map(l => l.name);
                const newLabels = new Set();

                // ── 1. Get changed files ────────────────────────────────────
                let files = [];
                let fPage = 1;
                try {
                  while (true) {
                    const { data } = await github.rest.pulls.listFiles({
                      owner, repo, pull_number: pr.number, per_page: 100, page: fPage,
                    });
                    files.push(...data);
                    if (data.length < 100) break;
                    fPage++;
                  }
                } catch (e) {
                  console.log(`  ⚠️  PR #${pr.number}: could not list files (${e.message})`);
                  continue;
                }

                const filePaths = files.map(f => f.filename);
                const totalChanges = files.reduce((sum, f) => sum + f.additions + f.deletions, 0);

                // ── 2. Path-based area labels ───────────────────────────────
                for (const rule of PATH_RULES) {
                  if (!existing.includes(rule.label) && filePaths.some(fp => rule.pattern.test(fp))) {
                    await ensureLabel(rule.label, rule.color, rule.desc);
                    newLabels.add(rule.label);
                  }
                }

                // ── 3. Size label ───────────────────────────────────────────
                const hasSize = existing.some(l => sizeLabels.includes(l));
                if (!hasSize) {
                  const sizeRule = SIZE_RULES.find(r => totalChanges <= r.max);
                  if (sizeRule) {
                    await ensureLabel(sizeRule.label, sizeRule.color, sizeRule.desc);
                    newLabels.add(sizeRule.label);
                  }
                }

                // ── 4. Apply collected labels ───────────────────────────────
                if (newLabels.size > 0) {
                  await addLabels(pr.number, [...newLabels]);
                  console.log(`🏷️  PR #${pr.number}: +${[...newLabels].join(', ')}`);
                  stats.labeled++;
                }

                // ── 5. Auto-assign PR author ────────────────────────────────
                const assignees = pr.assignees.map(a => a.login);
                if (assignees.length === 0) {
                  if (!dryRun) {
                    await github.rest.issues.addAssignees({
                      owner, repo, issue_number: pr.number, assignees: [pr.user.login],
                    });
                  }
                  console.log(`👤 PR #${pr.number}: assigned @${pr.user.login}`);
                  stats.assigned++;
                }

                // ── 6. Admin dashboard credentials comment ──────────────────
                const touchesAdmin = filePaths.some(fp => fp.startsWith('admin-dashboard/'));
                if (touchesAdmin) {
                  const { data: comments } = await github.rest.issues.listComments({
                    owner, repo, issue_number: pr.number, per_page: 50,
                  });
                  const alreadyPosted = comments.some(
                    c => c.user.login === 'github-actions[bot]' &&
                         c.body.includes('Admin Dashboard — Dev Credentials')
                  );

                  if (!alreadyPosted && !dryRun) {
                    await github.rest.issues.createComment({
                      owner, repo, issue_number: pr.number,
                      body: [
                        `## 🛠️ Admin Dashboard — Dev Credentials`,
                        ``,
                        `Hi @${pr.user.login}! Your PR modifies the **Admin Dashboard** — here are the dev setup instructions.`,
                        ``,
                        `### 🔑 Login Credentials`,
                        ``,
                        `| Field | Value |`,
                        `|-------|-------|`,
                        `| 📧 Email | _See your local .env file_ |`,
                        `| 🔒 Password | _See your local .env file_ |`,
                        ``,
                        `> ⚠️ Setup credentials in \`.env\` via \`ADMIN_USERNAME\` and \`ADMIN_PASSWORD\`.`,
                        ``,
                        `### 🚀 Local Dev Setup`,
                        ``,
                        '```bash',
                        `npm install`,
                        `npm run dev --workspace=admin-dashboard`,
                        '```',
                        ``,
                        `Dashboard: **http://localhost:5174**`,
                        ``,
                        `_Auto-posted by Retroactive Automation · Mentor: [@Ayushh-Sharmaa](https://github.com/Ayushh-Sharmaa)_`,
                      ].join('\n'),
                    });
                    console.log(`💬 PR #${pr.number}: posted admin dashboard credentials`);
                    stats.adminCommented++;
                  }
                }
              }

              // Stop if we've gone past the cutoff
              const oldest = new Date(prs[prs.length - 1].created_at);
              if (oldest < cutoff) break;
              page++;
            }

            console.log(`\n${'═'.repeat(50)}`);
            console.log(`📊 PR Summary`);
            console.log(`   Total scanned:       ${stats.total}`);
            console.log(`   Labeled:             ${stats.labeled}`);
            console.log(`   Authors assigned:    ${stats.assigned}`);
            console.log(`   Admin creds posted:  ${stats.adminCommented}`);
            console.log(`${'═'.repeat(50)}`);
