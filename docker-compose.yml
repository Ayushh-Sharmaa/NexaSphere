version: '3.9'

# Local development: runs the Express API + Nginx gateway + Redis.
# Frontend is served by Vite's dev server (npm run dev:website) for HMR support.
#
# Start everything:  docker compose up
# Gateway only:      docker compose up gateway
# Generate SSL cert: cd gateway && bash generate-certs.sh

services:
  # ── Express API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    expose:
      - '8787'
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      PORT: 8787
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      LOG_FORMAT: json
      METRICS_ENABLED: 'true'
      OTEL_SERVICE_NAME: nexasphere-api
      OTEL_ENABLED: 'false'
      # Allow requests from the Vite dev servers
      CORS_ORIGIN: 'http://localhost:5175,http://localhost:5001'
    networks:
      - default
      - observability
    volumes:
      - ./server:/app
      - /app/node_modules
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8787/health']
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── Redis Server ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Gateway (Nginx Proxy) ───────────────────────────────────────────────
  gateway:
    image: nginx:1.25-alpine
    container_name: nexasphere-gateway
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Nginx config (read-only)
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL certificates — generate with: cd gateway && bash generate-certs.sh
      - ./gateway/certs:/etc/nginx/certs:ro
      # Custom JSON error pages
      - ./gateway/errors:/etc/nginx/errors:ro
      # Persist access and error logs to the host for debugging/monitoring
      - ./logs/nginx:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - staging_internal
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:80/health']
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Staging Express API (Shadow Traffic Target) ─────────────────────────────
  staging-api:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    expose:
      - '8787'
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: staging
      PORT: 8787
      REDIS_URL: redis://staging-redis:6379
      LOG_FORMAT: json
      METRICS_ENABLED: 'false'
      OTEL_ENABLED: 'false'
    networks:
      - staging_internal
    restart: unless-stopped
    depends_on:
      staging-redis:
        condition: service_healthy

  # ── Staging Redis Server ────────────────────────────────────────────────────
  staging-redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    networks:
      - staging_internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Python AI API (optional) ─────────────────────────────────────────────────
  python-api:
    profiles: ['python', 'observability']
    build:
      context: ./server-python
      dockerfile: Dockerfile
      expose:
        - '8000'
      environment:
        REDIS_URL: redis://redis:6379/0
        OTEL_SERVICE_NAME: nexasphere-python
        OTEL_ENABLED: 'false'
        LOG_FORMAT: json
      depends_on:
        redis:
          condition: service_healthy
      restart: unless-stopped
      networks:
        - default
        - observability
      healthcheck:
        test: ['CMD', 'wget', '-qO-', 'http://localhost:8000/health']
        interval: 30s
        timeout: 5s
        retries: 3

  # ── Java Microservices API (optional) ────────────────────────────────────────
  java-api:
    profiles: ['java', 'observability']
    build:
      context: ./server-java
      dockerfile: Dockerfile
    expose:
      - '8081'
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_SERVICE_NAME: nexasphere-java
      OTEL_ENABLED: 'false'
    restart: unless-stopped
    networks:
      - default
      - observability
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8081/health']
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  observability:
    name: nexasphere-observability
    driver: bridge

# Redis is used for rate limiting and Socket.IO session sharing.